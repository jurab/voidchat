<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>void</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- SVG filter for liquid distortion -->
  <svg style="position: absolute; width: 0; height: 0;">
    <defs>
      <filter id="liquid">
        <feTurbulence id="turbulence" type="fractalNoise" baseFrequency="0.015" numOctaves="3" result="noise" />
        <feDisplacementMap in="SourceGraphic" in2="noise" scale="0" xChannelSelector="R" yChannelSelector="G" id="displacement" />
      </filter>
    </defs>
  </svg>

  <!-- Single sphere UI with text inside -->
  <div id="sphere-ui">
    <div id="visualizer-container">
      <div id="visualizer"></div>
      <div id="sphere-text-container">
        <button id="mic-btn">enable microphone</button>
        <button id="start-btn" class="hidden">enter the void</button>
        <div id="waiting-text" class="hidden">waiting</div>
      </div>
    </div>
    <div id="status" class="hidden">connecting...</div>
  </div>

  <script src="https://webrtc.github.io/adapter/adapter-latest.js"></script>
  <script src="app.js"></script>
</body>
</html>
