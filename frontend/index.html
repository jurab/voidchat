<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>void</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Initial state: need user gesture for mic permission -->
  <button id="start-btn">enter the void</button>

  <!-- SVG filter for liquid distortion -->
  <svg style="position: absolute; width: 0; height: 0;">
    <defs>
      <filter id="liquid">
        <feTurbulence id="turbulence" type="fractalNoise" baseFrequency="0.015" numOctaves="3" result="noise" />
        <feDisplacementMap in="SourceGraphic" in2="noise" scale="0" xChannelSelector="R" yChannelSelector="G" id="displacement" />
      </filter>
    </defs>
  </svg>

  <!-- Waiting state -->
  <div id="waiting-ui" class="hidden">
    <div id="waiting-text">waiting</div>
  </div>

  <!-- Main UI: shown when connected -->
  <div id="main-ui" class="hidden">
    <div id="visualizer-container">
      <div id="visualizer"></div>
    </div>
    <div id="status">connecting...</div>
  </div>

  <script src="https://webrtc.github.io/adapter/adapter-latest.js"></script>
  <script src="app.js"></script>
</body>
</html>
